<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Norse Kredit</title>
    <link rel="icon" href="img/icono.png" type="image/png">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="login-body">
    <div class="login-bg-orbs" aria-hidden="true">
        <span class="login-orb login-orb-1"></span>
        <span class="login-orb login-orb-2"></span>
        <span class="login-orb login-orb-3"></span>
        <span class="login-orb login-orb-4"></span>
    </div>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo-container">
                    <img src="img/icono.png" alt="Norse Kredit" class="logo-img">
                </div>
                <div class="company-name">NORSE KREDIT</div>
                <h1>Sistema de Préstamos</h1>
                <p>Plataforma empresarial de gestión</p>
            </div>

            <div class="social-login">
                <button class="social-btn" onclick="loginWithProvider('google')" type="button">
                    <i class="bi bi-google"></i>
                    Continuar con Google
                </button>
                <button class="social-btn" onclick="loginWithProvider('microsoft')" type="button">
                    <i class="bi bi-microsoft"></i>
                    Continuar con Microsoft
                </button>
                <button class="social-btn" onclick="loginWithProvider('phone')" type="button">
                    <i class="bi bi-telephone"></i>
                    Continuar con Teléfono
                </button>
            </div>

            <div class="divider">
                <span>O INICIA SESIÓN CON TU CUENTA</span>
            </div>

            <div class="login-form">
                <form id="loginForm">
                    <div class="form-group">
                        <label for="username">Correo electrónico o usuario</label>
                        <input type="text" id="username" class="form-control" placeholder="Ingresa tu correo o usuario" required autocomplete="username">
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" class="form-control" placeholder="Ingresa tu contraseña" required autocomplete="current-password">
                    </div>

                    <div class="remember-forgot">
                        <label class="remember-me">
                            <input type="checkbox" id="rememberMe">
                            <span>Recordar sesión</span>
                        </label>
                        <a href="javascript:void(0)" class="forgot-password" onclick="showForgotPasswordModal()">¿Olvidaste tu contraseña?</a>
                    </div>

                    <button type="submit" class="btn btn-login">Iniciar Sesión</button>
                </form>
            </div>

            <div class="signup-link">
                ¿No tienes una cuenta? <a href="javascript:void(0)">Solicita acceso corporativo</a>
            </div>
        </div>
    </div>

    <div id="forgotPasswordModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="bi bi-key"></i> Restablecer contraseña</h3>
                <button type="button" class="modal-close" onclick="closeForgotPasswordModal()" aria-label="Cerrar">&times;</button>
            </div>
            <form id="forgotPasswordForm" class="modal-body">
                <p class="text-muted" style="margin-bottom: 1rem;">Ingresa tu correo y enviaremos la solicitud al administrador para restablecer tu contraseña.</p>
                <div class="form-group">
                    <label for="forgotEmail">Correo electrónico</label>
                    <input type="email" id="forgotEmail" class="form-control" placeholder="tu@correo.com" required>
                </div>
                <div class="form-actions" style="margin-top: 1rem; display: flex; gap: 0.5rem; justify-content: flex-end;">
                    <button type="button" class="btn btn-secondary" onclick="closeForgotPasswordModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Enviar solicitud</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
